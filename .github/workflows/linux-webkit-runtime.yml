name: Linux WebKit Runtime

# Builds the patched WebKitGTK runtime that every AppImage build consumes.
#
# This is the expensive part of the Linux pipeline, so it only runs when the
# runtime inputs change: the WebKit version, the relocation patch or the build
# options in build/linux/runtime. The result is published as a release asset and
# pinned by checksum in build/linux/runtime/env.sh, and normal desktop builds
# download it instead of recompiling WebKit.
#
# After a successful run, copy the printed sha256 into RUNTIME_ASSET_SHA256 in
# build/linux/runtime/env.sh.
on:
  workflow_dispatch:
  push:
    paths:
      - 'build/linux/runtime/**'

permissions:
  contents: write

jobs:
  runtime:
    name: Build the pinned WebKit runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The WebKit build tree needs more room than a standard runner leaves
      # behind by default; drop the preinstalled toolchains this job never uses.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/google/chrome
          sudo docker image prune --all --force || true
          df -h / /var/lib/docker
          free -h

      # Fewer parallel compilers than cores keep the peak memory of the WebKit
      # build inside what a standard GitHub runner provides.
      - name: Build and export the runtime artifact
        env:
          BUILD_JOBS: 3
        run: bash build/linux/runtime/build-webkit-runtime.sh

      - name: Publish the runtime artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source build/linux/runtime/env.sh
          asset="bin/runtime/$RUNTIME_ASSET"
          sha256sum "$asset"
          if gh release view "$RUNTIME_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RUNTIME_RELEASE_TAG" "$asset" --clobber
          else
            gh release create "$RUNTIME_RELEASE_TAG" \
              --title "$RUNTIME_ID" \
              --notes "Pinned WebKitGTK runtime for dan-tick AppImages, see build/linux/runtime/README.md." \
              "$asset"
          fi
          {
            echo '### Published runtime'
            echo
            echo "- release: \`$RUNTIME_RELEASE_TAG\`"
            echo "- asset: \`$RUNTIME_ASSET\`"
            echo "- sha256: \`$(sha256sum "$asset" | cut -d' ' -f1)\`"
            echo
            echo 'Set `RUNTIME_ASSET_SHA256` in `build/linux/runtime/env.sh` to that value.'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: dan-tick-webkit-runtime
          path: bin/runtime/*.tar.gz
          if-no-files-found: error
          retention-days: 30
