name: Desktop Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Resolve build version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package-version: ${{ steps.version.outputs.package-version }}
      commit: ${{ steps.version.outputs.commit }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version

      - name: Test version, resource generation and release handling
        run: |
          go test ./build/tools
          bash build/linux/appimage/build.test.sh
          node --test .github/scripts/publish-release.test.mjs

      - name: Resolve version from the checked-out HEAD and event
        id: version
        run: go run ./build/tools version -github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} amd64
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      DAN_TICK_VERSION: ${{ needs.version.outputs.version }}
      DAN_TICK_PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
      DAN_TICK_COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          package_json_file: frontend/package.json
          run_install: false

      # The Linux build and packaging runs in the pinned image from
      # build/linux/runtime/Dockerfile, so the runner needs no GTK or WebKit
      # package and cannot leak its own libraries into the AppImage.
      - name: Check the container runtime for the Linux build
        if: matrix.platform == 'linux'
        run: |
          docker version --format '{{.Server.Version}}'
          docker buildx version
          # The packaging image and the AppDir need several GB; record what the
          # runner actually offers so a disk failure is diagnosable from the log.
          df -h / /var/lib/docker
          free -h

      - name: Locate or install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $nsisDirectory = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisDirectory\makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path "$nsisDirectory\makensis.exe")) { throw 'makensis.exe was not found' }
          $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install matching Wails CLI
        if: matrix.platform == 'windows'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Build the self-contained Linux AppImage
        if: matrix.platform == 'linux'
        run: bash build/linux/appimage/package.sh

      - name: Build Windows EXE and per-user NSIS installer
        if: matrix.platform == 'windows'
        run: wails3 task package GOOS=windows ARCH=amd64 INSTALL_SCOPE=user

      # Bindings and frontend assets now exist, including in a clean checkout.
      - name: Check frontend formatting, lint and behavior
        if: matrix.platform == 'linux'
        working-directory: frontend
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run test

      - name: Check Go code
        if: matrix.platform == 'linux'
        run: |
          go test ./...
          go vet ./...
          go test -race ./...

      - name: Check module files were not changed by the build
        shell: bash
        run: git diff --exit-code -- go.mod go.sum

      - name: Name artifacts and generate SHA-256 checksums
        run: node .github/scripts/stage-artifacts.mjs ${{ matrix.platform }}

      - name: Upload Linux CI artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: dan-tick-${{ needs.version.outputs.version }}-linux-amd64
          path: bin/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows EXE artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: dan-tick-${{ needs.version.outputs.version }}-windows-exe-amd64
          path: |
            bin/artifacts/dan-tick-${{ needs.version.outputs.version }}-windows-amd64.exe
            bin/artifacts/dan-tick-${{ needs.version.outputs.version }}-windows-amd64.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows installer artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: dan-tick-${{ needs.version.outputs.version }}-windows-installer-amd64
          path: |
            bin/artifacts/dan-tick-${{ needs.version.outputs.version }}-windows-amd64-installer.exe
            bin/artifacts/dan-tick-${{ needs.version.outputs.version }}-windows-amd64-installer.exe.sha256
            bin/artifacts/SHA256SUMS-windows-amd64.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  appimage-smoke:
    name: AppImage smoke on ${{ matrix.distribution }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 26.04
            image: ubuntu:26.04
            host-sandbox-tools: ''
          - distribution: Debian 13
            image: debian:13
            host-sandbox-tools: ''
          # Only this environment installs bubblewrap and xdg-dbus-proxy, so the
          # matrix covers both the packaged fallback helpers and the case where
          # WebKit prefers the system tools (and their security policy).
          - distribution: Fedora 44
            image: fedora:44
            host-sandbox-tools: bubblewrap xdg-dbus-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dan-tick-${{ needs.version.outputs.version }}-linux-amd64
          path: appimage-artifact

      - name: Verify the final AppImage checksum
        working-directory: appimage-artifact
        run: sha256sum --check SHA256SUMS-linux-amd64.txt

      - name: Prepare a minimal desktop test container
        env:
          SMOKE_BASE_IMAGE: ${{ matrix.image }}
          SMOKE_EXTRA_PACKAGES: ${{ matrix.host-sandbox-tools }}
        run: |
          docker build --tag dan-tick-appimage-smoke --build-arg BASE_IMAGE="$SMOKE_BASE_IMAGE" \
            --build-arg EXTRA_PACKAGES="$SMOKE_EXTRA_PACKAGES" --file - . <<'DOCKERFILE'
          ARG BASE_IMAGE=ubuntu:24.04
          ARG EXTRA_PACKAGES=
          FROM ${BASE_IMAGE}
          # GTK, WebKitGTK, JavaScriptCore, GIO modules and the sandbox helpers are
          # deliberately absent: the AppImage has to bring all of them.
          RUN if command -v apt-get >/dev/null; then \
                apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                  xvfb dbus-x11 xauth x11-utils imagemagick python3-pyatspi python3-gi gir1.2-glib-2.0 \
                  at-spi2-core fonts-noto-cjk libgl1-mesa-dri libegl1 procps passwd openssl \
                  ca-certificates fuse3 ${EXTRA_PACKAGES} \
                && rm -rf /var/lib/apt/lists/*; \
              else \
                dnf install -y xorg-x11-server-Xvfb dbus-daemon xorg-x11-xauth xwininfo xdpyinfo \
                  ImageMagick python3-pyatspi python3-gobject at-spi2-core tzdata google-noto-sans-cjk-fonts \
                  mesa-dri-drivers mesa-libEGL procps-ng shadow-utils openssl ca-certificates fuse3 \
                  ${EXTRA_PACKAGES} \
                && dnf clean all; \
              fi \
              && useradd --create-home --uid 1001 smoke
          # A test certificate authority lets the TLS check complete a real
          # handshake without touching any production endpoint.
          RUN mkdir -p /opt/dan-tick-smoke-tls \
              && openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj '/CN=dan-tick smoke CA' \
                   -keyout /opt/dan-tick-smoke-tls/ca.key -out /opt/dan-tick-smoke-tls/ca.crt \
              && openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
                   -keyout /opt/dan-tick-smoke-tls/server.key -out /opt/dan-tick-smoke-tls/server.csr \
              && printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > /tmp/san.cnf \
              && openssl x509 -req -days 2 -extfile /tmp/san.cnf -CAcreateserial \
                   -in /opt/dan-tick-smoke-tls/server.csr -CA /opt/dan-tick-smoke-tls/ca.crt \
                   -CAkey /opt/dan-tick-smoke-tls/ca.key -out /opt/dan-tick-smoke-tls/server.crt \
              && if command -v update-ca-certificates >/dev/null; then \
                   install -m0644 /opt/dan-tick-smoke-tls/ca.crt /usr/local/share/ca-certificates/dan-tick-smoke.crt \
                   && update-ca-certificates; \
                 else \
                   install -m0644 /opt/dan-tick-smoke-tls/ca.crt /etc/pki/ca-trust/source/anchors/dan-tick-smoke.crt \
                   && update-ca-trust; \
                 fi \
              && rm -f /opt/dan-tick-smoke-tls/ca.key /opt/dan-tick-smoke-tls/ca.srl /opt/dan-tick-smoke-tls/server.csr \
              && chmod 0644 /opt/dan-tick-smoke-tls/*
          USER 1001
          DOCKERFILE

      - name: Allow nested user namespaces in the smoke container
        run: |
          # Ubuntu 24.04 restricts capabilities in unconfined user namespaces.
          # Grant userns only to this named test-container profile, keeping the
          # runner's global policy and the application's WebKit sandbox intact.
          cat > "$RUNNER_TEMP/dan-tick-appimage-smoke.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          profile dan-tick-appimage-smoke flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace "$RUNNER_TEMP/dan-tick-appimage-smoke.apparmor"

      - name: Check the packaged WebView with its sandbox enabled
        timeout-minutes: 20
        run: |
          mkdir -p appimage-smoke-results
          chmod 0777 appimage-smoke-results
          # Only this disposable test container relaxes outer namespace restrictions.
          # The application retains the WebKit sandbox and has no network or user data.
          docker run --rm --network none \
            --device /dev/fuse --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=dan-tick-appimage-smoke \
            --security-opt systempaths=unconfined \
            --mount "type=bind,src=$PWD/.github/scripts,dst=/scripts,readonly" \
            --mount "type=bind,src=$PWD/appimage-artifact,dst=/artifact,readonly" \
            --mount "type=bind,src=$PWD/appimage-smoke-results,dst=/results" \
            dan-tick-appimage-smoke \
            bash /scripts/appimage-smoke.sh /artifact /results

      - name: Upload AppImage smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-smoke-${{ matrix.distribution }}
          path: appimage-smoke-results/*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tagged release
    needs: [version, build, appimage-smoke]
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: dan-tick-${{ needs.version.outputs.version }}-*-amd64
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and publish the completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.version }}
        run: bash .github/scripts/publish-release.sh
