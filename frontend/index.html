<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>dan-tick</title>
    <script>
      // Apply the stored UI preference before CSS is rendered to avoid a theme flash.
      {
        let preference = 'dark'
        try {
          const saved = localStorage.getItem('dan-tick-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch {
          // Private/restricted WebViews may block storage.
        }
        document.documentElement.dataset.theme =
          preference === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
